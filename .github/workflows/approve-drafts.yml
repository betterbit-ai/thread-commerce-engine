name: Review calibration drafts
on:
  workflow_dispatch:
    inputs:
      draft_ids:
        description: Comma-separated draft IDs from the calibration report
        required: true
        type: string
      label:
        description: Human review result
        required: true
        type: choice
        options: [approve, reject, uncertain]
      notes:
        description: Optional non-secret review notes
        required: false
        type: string
permissions: { contents: write }
concurrency: { group: repository-writer, cancel-in-progress: false }
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm labels:apply
        env:
          DRAFT_IDS: ${{ inputs.draft_ids }}
          HUMAN_LABEL: ${{ inputs.label }}
          LABEL_NOTES: ${{ inputs.notes }}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/labels data/runtime data/campaigns data/storefront reports/calibration
          git diff --cached --quiet || git commit -m "data(labels): persist reviewed campaign decisions [skip ci]"
          git push
