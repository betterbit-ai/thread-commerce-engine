name: Collect Coupang performance
on:
  workflow_dispatch:
  schedule:
    - cron: '23 16 * * *'
      timezone: Asia/Seoul
permissions: { contents: write }
concurrency: { group: repository-writer, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm metrics:coupang
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_REPORT_CLICKS_PATH: ${{ vars.COUPANG_REPORT_CLICKS_PATH }}
          COUPANG_REPORT_ORDERS_PATH: ${{ vars.COUPANG_REPORT_ORDERS_PATH }}
          COUPANG_REPORT_COMMISSION_PATH: ${{ vars.COUPANG_REPORT_COMMISSION_PATH }}
          COUPANG_REPORT_CAMPAIGN_FIELD: ${{ vars.COUPANG_REPORT_CAMPAIGN_FIELD }}
          COUPANG_REPORT_CLICKS_FIELD: ${{ vars.COUPANG_REPORT_CLICKS_FIELD }}
          COUPANG_REPORT_ORDERS_FIELD: ${{ vars.COUPANG_REPORT_ORDERS_FIELD }}
          COUPANG_REPORT_COMMISSION_FIELD: ${{ vars.COUPANG_REPORT_COMMISSION_FIELD }}
          COUPANG_REPORT_PERIOD_FIELD: ${{ vars.COUPANG_REPORT_PERIOD_FIELD }}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events/coupang data/analytics reports/analytics data/state/coupang-api-budgets.json
          git diff --cached --quiet || git commit -m "data(metrics): ingest Coupang performance [skip ci]"
          git push
