name: Collect Threads metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */3 * * *'
      timezone: Asia/Seoul
permissions: { contents: write }
concurrency: { group: repository-writer, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm metrics:threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - run: pnpm funnel:build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A data reports
          git diff --cached --quiet || git commit -m "data(metrics): sample Threads insights [skip ci]"
          git push
      - if: failure()
        run: node scripts/slack-notify.mjs
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_MESSAGE: '⚠️ Techpick Threads 성과 수집 워크플로우가 실패했습니다. GitHub Actions 로그를 확인하세요.'
