name: Deploy storefront to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      [
        'storefront/**',
        'data/storefront/**',
        'public/**',
        'astro.config.mjs',
        'package.json',
        'pnpm-lock.yaml',
      ]
  workflow_dispatch:
  workflow_run:
    workflows: ['Plan content']
    types: [completed]
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      storefront_hash: ${{ steps.storefront_hash.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: storefront_hash
        run: echo "value=$(shasum -a 256 data/storefront/offers.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - run: pnpm storefront:build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  record:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: repository-writer, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v6
      - name: Record the data hash actually deployed
        env:
          DATA_HASH: ${{ needs.build.outputs.storefront_hash }}
        run: |
          node -e 'const fs=require("fs");fs.mkdirSync("data/state",{recursive:true});fs.writeFileSync("data/state/storefront-deployment.json",JSON.stringify({schema_version:1,data_hash:process.env.DATA_HASH,deployed_at:new Date().toISOString(),workflow_run_id:process.env.GITHUB_RUN_ID},null,2)+"\n")'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/state/storefront-deployment.json
          git diff --cached --quiet || git commit -m "data(storefront): record deployed offer projection [skip ci]"
          git push
