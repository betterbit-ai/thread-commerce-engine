name: Ingest products
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
      timezone: Asia/Seoul
permissions: { contents: write }
concurrency: { group: repository-writer, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm products:ingest
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      - name: Commit generated product data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products data/catalog data/state/coupang-api-budgets.json
          git diff --cached --quiet || git commit -m "data(products): ingest Coupang snapshots [skip ci]"
          git push
