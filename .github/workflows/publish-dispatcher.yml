name: Publish dispatcher
on:
  workflow_dispatch:
  schedule:
    - cron: '3/10 * * * *'
      timezone: Asia/Seoul
permissions: { contents: write }
concurrency: { group: repository-writer, cancel-in-progress: false }
jobs:
  publish:
    environment: production
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create and persist one-time Threads containers
        run: pnpm publish:prepare
        env:
          PUBLISH_ENABLED: 'true'
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Commit publication claims before external publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/campaigns data/runtime data/state/publications
          git diff --cached --quiet || git commit -m "data(publish): claim one-time Threads containers [skip ci]"
          git push
      - run: pnpm publish:due
        env:
          PUBLISH_ENABLED: 'true'
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Persist publication receipt
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/campaigns data/runtime data/state
          git diff --cached --quiet || git commit -m "data(publish): record Threads publication receipts [skip ci]"
          git push
