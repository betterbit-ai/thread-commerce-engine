name: Publish warmup text
on:
  workflow_dispatch:
    inputs:
      warmup_id:
        description: Stable idempotency key for this warmup post
        required: true
        type: string
      text:
        description: Korean text-only post, without affiliate links or disclosure
        required: true
        type: string
permissions: { contents: write }
concurrency: { group: repository-writer, cancel-in-progress: false }
jobs:
  publish:
    environment: production
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm warmup:prepare
        env:
          PUBLISH_ENABLED: 'true'
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          WARMUP_ID: ${{ inputs.warmup_id }}
          WARMUP_TEXT: ${{ inputs.text }}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A data/state/warmup-publications
          git diff --cached --quiet || git commit -m "data(warmup): claim Threads warmup post [skip ci]"
          git push
      - run: pnpm warmup:publish
        env:
          PUBLISH_ENABLED: 'true'
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          WARMUP_ID: ${{ inputs.warmup_id }}
          WARMUP_TEXT: ${{ inputs.text }}
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A data/state/warmup-publications
          git diff --cached --quiet || git commit -m "data(warmup): record Threads warmup receipt [skip ci]"
          git push
